name: security

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # toda segunda-feira

permissions:
  contents: read

jobs:
  govulncheck:
    name: vulnerabilidades em dependências Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with: { go-version-file: go.mod }

  trivy:
    name: scan do repositório (dependências, segredos, configuração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: .env.example,deploy/kong/kong.yml # segredos de desenvolvimento documentados
